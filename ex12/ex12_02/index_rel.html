<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Positioning Boxes</title>
</head>
<body>
    <div style="background-color:aliceblue; width: 100px; height: 100px;">
    </div>
    <div style="background-color:black; width: 100px; height: 100px; position:relative; top: -100px; left: 100px; "></div>
    <div style="background-color:aliceblue; width: 100px; height: 100px; position:relative; top: -200px; left: 200px; "></div>
    <div style="background-color:black; width: 100px; height: 100px; position:relative; top: -200px; left: 0px; "></div>
    <div style="background-color:aliceblue; width: 100px; height: 100px; position:relative; top: -300px; left: 100px; "></div>
    <div style="background-color:black; width: 100px; height: 100px; position:relative; top: -400px; left: 200px; "></div>
    <div style="background-color:aliceblue; width: 100px; height: 100px; position:relative; top: -400px; left: 0px; "></div>
    <div style="background-color:black; width: 100px; height: 100px; position:relative; top: -500px; left: 100px; "></div>
    <div style="background-color:aliceblue; width: 100px; height: 100px; position:relative; top: -600px; left: 200px; "></div>
</body>
</html>
