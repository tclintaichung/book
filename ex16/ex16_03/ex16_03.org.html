<!DOCTYPE html>
<html>
<head>
  <title>OpenCV.js Image Load</title>
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="cv_ready();" type="text/javascript"></script>
</head>
<body>
  <img id="image" src="leaves.jpg" alt="Input Image" crossorigin="anonymous" hidden/>
  <button id="button" style="background-color: aquamarine; padding: 5px; border-radius: 5px; margin: 5px;">Image Processing</button><br/>
  <canvas id="canvas1" width="500" height="400" style="border:1px solid #000000;"></canvas><br/>
  <canvas id="canvas2" width="500" height="400" style="border:1px solid #000000;"></canvas><br/>
  <canvas id="canvasOutput" width="256" height="100" style="border:1px solid #000000;"></canvas><br/>
  <p id="p"></p>
  <script type="text/javascript">
    const button = document.getElementById("button");
    const image = document.getElementById('image');
    const p = document.getElementById('p');
    function cv_ready() {
      cv['onRuntimeInitialized'] = () => {
        console.log("CV is ready");
      };
    };
    button.addEventListener('click', function (e) {
      let src = cv.imread(image);
cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY, 0);
let roi = src.roi(new cv.Rect(700, 150, 500, 400));
let srcVec = new cv.MatVector();
srcVec.push_back(roi);
let accumulate = false;
let channels = [0];
let histSize = [256];
let ranges = [0, 255];
let hist = new cv.Mat();
let mask = new cv.Mat();
let color = new cv.Scalar(255, 255, 255);
let scale = 2;
// You can try more different parameters

cv.calcHist(srcVec, channels, mask, hist, histSize, ranges, accumulate);
let result = cv.minMaxLoc(hist, mask);
let max = result.maxVal;
let dst = new cv.Mat.zeros(src.rows, histSize[0] * scale,
                           cv.CV_8UC3);
// draw histogram
const binWidth = 1;
// let histImage = new cv.Mat(400, 512, cv.CV_8UC3, new cv.Scalar(0, 255, 0))
// for (let i = 0; i < histSize; i++) {
//     cv.line(histImage,
//           cv.Point(binWidth * (i - 1), histImage.rows - (hist[i - 1])),
//           cv.Point(binWidth * i, histImage.rows - (hist[i])),
//           cv.Scalar(0, 255, 0, 0), 2, 8, 0);
// }

for (let i = 0; i < histSize[0]; i++) {
    // let binVal = hist.data32F[i] * src.rows / max;
    let binVal = hist.data32F[i] ;
    
    let point1 = new cv.Point(i * scale, src.rows - 1);
    let point2 = new cv.Point((i + 1) * scale - 1, src.rows - binVal);
    cv.rectangle(dst, point1, point2, color, cv.FILLED);
}
cv.imshow('canvasOutput', dst);
src.delete(); dst.delete(); srcVec.delete(); mask.delete(); hist.delete();
      
      
      // cv.cvtColor(dst, imgGray, cv.COLOR_RGBA2GRAY);
      // let imgEdge = new cv.Mat();
      // cv.Canny(dst, imgEdge, 50, 150);
      // cv.imshow('canvas1', dst);
      // cv.imshow('canvas2', imgEdge);
      // imgGray.delete();
      // imgEdge.delete();
      // hist.delete(); mask.delete(); histImage.delete();
    });
  </script>
</body>
</html>
