<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola curves</title>
</head>
<body>
    <canvas id="myCanvas" width="300px" height="300px"></canvas>
    <script>
        const a = 3;
        const b = -6;
        const c = 4;
        const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FFA500", "#FFFFFF"];
        const myCube = document.getElementById("myCanvas");
        const ctx = myCube.getContext("2d");
        const point_x = [];
        const point_y1 = [];
        const point_y2 = [];
        const scale = 2.;

        for (let i = -100; i <= 100; i++) {
            point_x.push(50*scale + i*scale);
            point_y1.push(parabola_max(i*scale));
        }
        for (let i = -100; i <= 100; i++) {
            point_x.push(50*scale +i*scale);
            point_y2.push(parabola_min(i*scale));
        } 

        ctx.beginPath();
        ctx.moveTo(point_x[0], point_y1[0]);
        for (let i = 1; i < point_x.length; i++) {
            ctx.lineTo(point_x[i], point_y1[i]);
        }
        ctx.closePath();
        ctx.strokeStyle = colors[2];
        ctx.lineWidth = 1;  
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(point_x[0], point_y2[0]);
        for (let i = 1; i < point_x.length; i++) {
            ctx.lineTo(point_x[i], point_y2[i]);
        }
        ctx.closePath();
        ctx.strokeStyle = colors[1];
        ctx.lineWidth = 1;  
        ctx.stroke();
       
      function frame(x_min, x_max, y_min, y_max) {
          ctx.beginPath();
          ctx.moveTo(x_min, y_max);
          ctx.lineTo(x_max, y_max);
          ctx.moveTo(x_min, y_max);
          ctx.lineTo(x_min, y_max);
          ctx.closePath();
          ctx.strokeStyle = colors[0];
          ctx.lineWidth = 1;
          ctx.stroke();
          for (let i = x_min; i <= x_max; i += 10) {
              ctx.fillText(String(i), i, y_max +10);
          }
          for (let i = y_min; i <= y_max; i += 10) {
              ctx.fillText(String(i), x_min - 10, i) ;
          }
      }
   </script>     
</body>
</html>
