<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Shapes</title>
</head>
<body>
    <a download="rubikCube.jpg" href="" onclick="downloadImage(this);">Download Image</a><br/>
    <canvas id="myCanvas" width="185px" height="185px"></canvas>
    <script>
        const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FFA500", "#FFFFFF"];
        const myCube = document.getElementById("myCanvas");
        if (myCube.getContext) {
            const ctx = myCube.getContext("2d");
            ctx.beginPath(); 
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fillRect(5 + j * 60, 5 + i * 60, 55, 55);
                }
            }   
            ctx.closePath();
        }
        downloadImage = function(a) {
            var imageURI = myCube.toDataURL("image/jpg");
            a.href = imageURI;
        } 
   </script>     
</body>
</html>
