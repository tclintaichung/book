<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Shapes</title>
</head>
<body>
    <a download="rubikCube.jpg" href="" onclick="downloadImage(this);">Download Image</a><br/>
    <canvas id="myCanvas" width="300px" height="300px"></canvas>
    <script>
        const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FFA500", "#FFFFFF"];
        const myCube = document.getElementById("myCanvas");
        const ctx = myCube.getContext("2d");
        const point_x = [2,2.1,3,4,5,6,7,8,9,9.5,7.7,7,6,5,4,3,2.5,3.5];
        const point_y = [4.5,4,3,2.5,2.5,3.2,3.8,3.8,3.0,5.5,5,5,6,6.7,6.7,6.4,5.5,5]; 

        for (let i = 0; i < point_x.length; i++) {
            point_x[i] = point_x[i] * 20;
            point_y[i] = point_y[i] * 20;
        } 
        ctx.beginPath();
        ctx.moveTo(point_x[0], point_y[0]);
        for (let i = 1; i < point_x.length; i++) {
            ctx.lineTo(point_x[i], point_y[i]);
        }
        ctx.closePath();
        ctx.strokeStyle = colors[0];
        ctx.lineWidth = 2;  
        ctx.stroke();
        ctx.beginPath();
        const center_x = 4.2 * 20;
        const center_y = 3.5 * 20;
        const radius = 1.2 * 5;
        ctx.arc(center_x, center_y, radius, 0, 2 * Math.PI);
        ctx.moveTo(center_x, center_y);
        ctx.fillStyle = 'black';
        ctx.fill();

   </script>     
</body>
</html>
