<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola curves</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
<h1>Parabola curves</h1>
<div>
  <div>
    <p>y = ax^2 + bx + c</p>
    <label for="a">a</label>  
    <input type="number" name="a" value="1" id="a"><br/>
    <label for="b">b</label>
    <input type="number" name="b" value="1" id="b"><br/>
    <label for="c">c</label> 
    <input type="number" name="c" value="1" id="c"><br/>
    <label for="scale">Zoom in/out</label>
    <input type="number" name="scale" value="10" id="scale"><br/>
  </div>
  <div>
    <canvas id="myCanvas" width="300px" height="300px"></canvas>
  </div>
</div>
    
    <script>
        const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FFA500", "#FFFFFF"];
        const myCanvas = document.getElementById("myCanvas");
        const ctx = myCanvas.getContext("2d");
        myCanvas.width = 1400;
        myCanvas.height = 700
        const point_x = [];
        const point_y = [];
        let scale = 10;

        const scaleInput = document.getElementById("scale");
        const aInput = document.getElementById("a");
        const bInput = document.getElementById("b");    
        const cInput = document.getElementById("c");
        let a = Number(aInput.value);
        let b = Number(bInput.value);
        let c = Number(cInput.value);
        scaleInput.addEventListener("change", function() {
            scale = Number(scaleInput.value);
            ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
            point_x.length = 0;
            point_y.length = 0;
            parabola(point_x, point_y);
            drawCurve(point_x, point_y, scale);
            drawFrame(0, myCanvas.width, 0, myCanvas.height, scale);
        });
        aInput.addEventListener("change", function() {
            a = Number(aInput.value);
            ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
            point_x.length = 0;
            point_y.length = 0;
            parabola(point_x, point_y);
            drawCurve(point_x, point_y, scale);
            drawFrame(0, myCanvas.width, 0, myCanvas.height, scale);
        }); 
        bInput.addEventListener("change", function() {
            b = Number(bInput.value);
            ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
            point_x.length = 0;
            point_y.length = 0;
            parabola(point_x, point_y);
            drawCurve(point_x, point_y, scale);
            drawFrame(0, myCanvas.width, 0, myCanvas.height, scale);
        });
        cInput.addEventListener("change", function() {
            c = Number(cInput.value);
            ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);
            point_x.length = 0;
            point_y.length = 0;
            parabola(point_x, point_y);
            drawCurve(point_x, point_y, scale);
            drawFrame(0, myCanvas.width, 0, myCanvas.height, scale);
        });
        function drawFrame(x_min, x_max, y_min, y_max, scale) {
            const center_x = (x_min + x_max) / 2;
            const center_y = (y_min + y_max) / 2;
            const step = 20 * scale;
            ctx.beginPath();
            ctx.moveTo(x_min, center_y);
            ctx.lineTo(x_max, center_y);  
            ctx.moveTo(center_x, y_min);
            ctx.lineTo(center_x, y_max);
            ctx.strokeStyle = colors[2];
            ctx.lineWidth = 1;

            let label_i = 0;
            for (let i = center_x; i <= x_max; i += step) {
                label_i = (i - center_x) / scale;
                ctx.moveTo(i, center_y - 5);
                ctx.lineTo(i, center_y + 5);
                ctx.fillText(String(label_i), i, center_y + 10);
            }
            for (let i = center_x; i >= x_min; i -= step) {
                label_i = (i - center_x) / scale;
                ctx.moveTo(i, center_y - 5);
                ctx.lineTo(i, center_y + 5);
                ctx.fillText(String(label_i), i, center_y + 10);
            }
            for (let i = center_y; i <= y_max; i += step) {
                label_i = (i - center_y) / scale; 
                ctx.moveTo(center_x - 5, i);
                ctx.lineTo(center_x + 5, i);
                ctx.fillText(String(label_i), center_x - 20, y_max -i);
            }
            for (let i = center_y; i >= y_min; i -= step) {
                label_i = (i - center_y) / scale; 
                ctx.moveTo(center_x - 5, i);
                ctx.lineTo(center_x + 5, i);
                ctx.fillText(String(label_i), center_x - 20, y_max -i);
            }
            ctx.closePath();
            ctx.font = "12px bold monospace";
            ctx.stroke();
        }
        function parabola(point_x, point_y) {
            for (let i = -200; i <= 200; i++) {
                point_x.push(i);
                point_y.push(a * i * i + b * i + c);
            } 
        } 
        function drawCurve(point_x, point_y, scale) {
            ctx.beginPath();
            ctx.moveTo(point_x[0] * scale + myCanvas.width / 2, myCanvas.height / 2 - point_y[0] * scale);
            for (let i = 1; i < point_x.length; i++) {
                ctx.lineTo(point_x[i] * scale + myCanvas.width / 2, myCanvas.height / 2 - point_y[i] * scale);
            }
            ctx.strokeStyle = colors[0];
            ctx.lineWidth = 2;  
            ctx.stroke();
        }
   </script>     
</body>
</html>
