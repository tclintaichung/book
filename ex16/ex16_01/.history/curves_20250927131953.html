<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola curves</title>
</head>
<body>
    <canvas id="myCanvas" width="300px" height="300px"></canvas>
    <script>
        const a = 2.0;
        const b = 1.0;
        const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FFA500", "#FFFFFF"];
        const myCube = document.getElementById("myCanvas");
        const ctx = myCube.getContext("2d");
        const point_x = [];
        const point_y = [];

        for (let i = 0; i < 10; i++) {
            point_x.push(i*10);
            point_y.push(parabola_max(i*10));
        }
        for (let i = 0; i < 10; i++) {
            point_x.push(90 - i*10);
            point_y.push(parabola_min(90 - i*10));
        } 

        ctx.beginPath();
        ctx.moveTo(point_x[0], point_y[0]);
        for (let i = 1; i < point_x.length; i++) {
            ctx.lineTo(point_x[i], point_y[i]);
        }
        ctx.closePath();
        ctx.strokeStyle = colors[0];
        ctx.lineWidth = 2;  
        ctx.stroke();
       
      function parabola_max(x) {
          return a * x * x + b * x;
      }
      function parabola_min(x) {
          return -a * x * x + b * x;
      } 
   </script>     
</body>
</html>
