<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola curves</title>
</head>
<body>
    <canvas id="myCanvas" width="300px" height="300px"></canvas>
    <script>
        const a = 4;
        const b = -3.0;
        const c = 3.0;
        const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FFA500", "#FFFFFF"];
        const myCube = document.getElementById("myCanvas");
        const ctx = myCube.getContext("2d");
        const point_x = [];
        const point_y1 = [];
        const point_y2 = [];
        const scale = 2.;

        for (let i = -10; i <= 10; i++) {
            point_x.push(10*scale +i*scale);
            point_y1.push(parabola_max(i*scale));
        }
        for (let i = -10; i <= 10; i++) {
            point_x.push(10*scale +i*scale);
            point_y2.push(parabola_min(i*scale));
        } 

        ctx.beginPath();
        ctx.moveTo(point_x[0], point_y1[0]);
        for (let i = 1; i < point_x.length; i++) {
            ctx.lineTo(point_x[i], point_y1[i]);
        }
        ctx.closePath();
        ctx.strokeStyle = colors[2];
        ctx.lineWidth = 1;  
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(point_x[0], point_y2[0]);
        for (let i = 1; i < point_x.length; i++) {
            ctx.lineTo(point_x[i], point_y2[i]);
        }
        ctx.closePath();
        ctx.strokeStyle = colors[1];
        ctx.lineWidth = 1;  
        ctx.stroke();
       
      function parabola_max(x) {
          return a * x * x + b * x + c;
      }
      function parabola_min(x) {
          return -a * x * x + b * x + c;
      } 
   </script>     
</body>
</html>
