<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola curves</title>
</head>
<body>
    <canvas id="myCanvas" width="300px" height="300px"></canvas>
    <script>
        const a = 3;
        const b = -6;
        const c = 4;
        const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FFA500", "#FFFFFF"];
        const myCube = document.getElementById("myCanvas");
        const ctx = myCube.getContext("2d");
        const point_x = [];
        const point_y1 = [];
        const point_y2 = [];
        const scale = 2.;

        frame(20, 280, 20, 280);
      
      
       
      function frame(x_min, x_max, y_min, y_max) {
          ctx.beginPath();
          ctx.moveTo(x_max + 20, y_max);
          ctx.lineTo(x_min, y_max);
          ctx.lineTo(x_min, y_min);
          ctx.strokeStyle = colors[0];
          ctx.lineWidth = 1;
          ctx.stroke();
          for (let i = x_min; i <= x_max; i +=20) {
              ctx.fillText(String(i), i, y_max + 10);
          }
          for (let i = y_min; i <= y_max; i += 20) {
              ctx.fillText(String(i), x_min - 20, i) ;
          }
      }
   </script>     
</body>
</html>
