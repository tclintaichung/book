<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola curves</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <h1>Parabola curves</h1>
    <div>
        <p>y = ax^2 + bx + c</p><br>
        <label for="a">a</label>  
        <input type="number" name="a" value="1" id="a">
        <label for="b">b</label>
        <input type="number" name="b" value="1" id="b">
        <label for="c">c</label> 
        <input type="number" name="c" value="1" id="c">
        <button id="zoom-in">Zoom in</button>
        <button id="zoom-out">Zoom out</button> 
    </div>
    <canvas id="myCanvas" width="1400px" height="700px"></canvas>
    <script src="ex16.01.js"></script>
</body>
</html>
