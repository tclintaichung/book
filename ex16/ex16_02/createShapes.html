<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Shapes</title>
</head>
<body>
    <a download="myShapes.jpg" href="" onclick="downloadImage(this);">Download Image</a>
    <canvas id="myShapes" width="320px" height="320px"></canvas>
    <script>
        const myShapes = document.getElementById("myShapes");
        if (myShapes.getContext) {
            const ctx = myShapes.getContext("2d");
            ctx.beginPath(); 
            ctx.fillStyle = "#FF00FF";
            ctx.fillRect(50, 100, 75, 75);
            ctx.beginPath();
            ctx.fillStyle = "green";
            ctx.arc(200, 75, 50, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.fillStyle = "blue";
            ctx.moveTo(200, 200);
            ctx.lineTo(300, 200);
            ctx.lineTo(250, 150);
            ctx.fill();
        }
        downloadImage = function(a) {
            var imageURI = myShapes.toDataURL("image/jpg");
            a.href = imageURI;
        }
   </script>     
</body>
</html>
