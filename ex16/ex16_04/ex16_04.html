<!DOCTYPE html>
<html>
<head>
  <title>Compute area of Shapes - OpenCV.js Image Load</title>
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="cv_ready();" type="text/javascript"></script>
</head>
<body>
  <img id="image" src="myShapes.jpg" alt="Input Image" crossorigin="anonymous" hidden/>
  <button id="button" style="background-color: aquamarine; padding: 5px; border-radius: 5px; margin: 5px;">Image Processing</button><br/>
  <canvas id="canvas1" width="300" height="100" style="border:1px solid #000000;"></canvas><br/>
  <canvas id="canvas2" width="300" height="100" style="border:1px solid #000000;"></canvas><br/>
  <p id="p"></p>
  <script type="text/javascript">
    const button = document.getElementById("button");
    const image = document.getElementById('image');
    const p = document.getElementById('p');
    function cv_ready() {
      cv['onRuntimeInitialized'] = () => {
        console.log("CV is ready");
      };
    };
    button.addEventListener('click', function (e) {
      let imgSrc = cv.imread(image);
      let imgGray = new cv.Mat();
      let imgBinary = new cv.Mat();
      // gray image
      cv.cvtColor(imgSrc, imgGray, cv.COLOR_RGBA2GRAY);  
      // Binary image
      cv.threshold(imgGray, imgBinary, 20, 255, cv.THRESH_BINARY);
      // Find contours
      contours = new cv.MatVector();
      cv.findContours(imgBinary, contours, new cv.Mat(), cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE); 
      let area = 0;
      let areaStr = "";
      for (let i = 0; i < contours.size(); i++) {
        let contour = contours.get(i);
        area = cv.contourArea(contour, false);
        areaStr +=  "Area of shape " + String(i) + ": " + String(area) + "\n";
      }
      cv.imshow('canvas1', imgSrc);          
      cv.imshow('canvas2', imgBinary);
      p.innerText = areaStr;
      imgGray.delete(); 
      imgBinary.delete();  
    });
  </script>
</body>
</html>
